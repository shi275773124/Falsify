name: Falsify Review (L2 lint)

# Auto-running PR gate for this repo. Eats our own dog food: every PR that
# changes a decision doc (.md) gets a Falsify verdict comment + CI status.
#
# Authority ceiling: L2_LINT / EPISTEMIC_ONLY — not claim-bearing quant authority,
# not capital authorization. doctor/selftest green is never promotion authority.
#
# Verdict source: `python -m falsify gate --base origin/<base> --tier $FALSIFY_TIER --json`
# - gate is an HONEST STUB (L2 static check = lint). It never fake-reports BLOCK
#   on clean input and never fake-reports PASS on dirty input. v1.1 routes
#   --tier quant through quant_falsify_gate.
#
# Status mapping: PASS / PASS_WITH_DEBT -> success; BLOCK / KILL -> failure.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: falsify-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  falsify:
    runs-on: ubuntu-latest
    env:
      FALSIFY_TIER: ${{ vars.FALSIFY_TIER || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to diff against the base ref

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Falsify
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run Falsify gate
        id: gate
        continue-on-error: true
        env:
          # Scope to actual decision-doc drafts. README/docs/examples are
          # intentionally plain prose and would noise the gate. Add more --glob
          # lines as new decision-doc paths appear.
          FALSIFY_GLOBS: >-
            --glob demo-vault/research/**/*.md
            --glob examples/comparison-case-study/05-final-excerpt.md
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          # Ensure the base ref is locally present (checkout@v4 may not fetch it).
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          # shellcheck disable=SC2086
          python -m falsify gate --base "$base" --tier "$FALSIFY_TIER" \
            --json falsify-out.json $FALSIFY_GLOBS
        # gate exits 0 on PASS/PASS_WITH_DEBT, 1 on BLOCK. We capture instead of
        # failing the job so the comment step always runs.

      - name: Parse verdict
        id: verdict
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('falsify-out.json', encoding='utf-8') as f:
              d = json.load(f)
          v = d.get('verdict', 'NO_DECISION')
          print(f"verdict={v}")
          print(f"tier={d.get('tier_used','auto')}")
          print(f"base={d.get('base','')}")
          print("summary<<FALSIFY_SUMMARY_EOF")
          print(d.get('summary', 'no summary'))
          print("FALSIFY_SUMMARY_EOF")
          PY

      - name: Build PR comment body
        id: body
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          TIER: ${{ steps.verdict.outputs.tier }}
          BASE: ${{ steps.verdict.outputs.base }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$VERDICT" in
            PASS)            emoji="✅" ;;
            PASS_WITH_DEBT)  emoji="⚠️" ;;
            BLOCK)           emoji="🛑" ;;
            KILL)            emoji="☠️" ;;
            *)               emoji="❓" ;;
          esac
          {
            echo "body<<FALSIFY_BODY_EOF"
            echo "<!-- falsify-pr-review -->"
            echo ""
            echo "## Falsify Review (L2 lint)"
            echo ""
            echo "${emoji} **VERDICT: ${VERDICT}**  ·  tier=\`${TIER}\`  ·  base=\`${BASE}\`  ·  ceiling=\`L2_LINT / EPISTEMIC_ONLY\`"
            echo ""
            echo "> Scope: static decision-doc gate only. Not quant promotion authority. Not capital authorization."
            echo ""
            echo "${SUMMARY}"
            echo ""
            echo "---"
            echo "_Powered by [\`falsify gate\`](https://github.com/shi275773124/Falsify) — L2 lint / epistemic-only.  run [#${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo "FALSIFY_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR (idempotent)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          # Pass the multi-line body via env to avoid JS template-literal
          # escaping issues: the body contains literal backticks (e.g.
          # `tier=auto`, `falsify gate`) that would break `${{ }}` interpolation.
          COMMENT_BODY: ${{ steps.body.outputs.body }}
        with:
          script: |
            const marker = '<!-- falsify-pr-review -->';
            const body = process.env.COMMENT_BODY;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const prev = comments.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body
              });
              core.info(`Updated existing Falsify comment ${prev.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
              core.info(`Created Falsify comment ${created.id}`);
            }

      - name: Upload gate JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: falsify-gate-out
          path: falsify-out.json
          if-no-files-found: error

      - name: Set CI status (BLOCK/KILL fail the job)
        if: always()
        run: |
          v="${{ steps.verdict.outputs.verdict }}"
          echo "Falsify verdict: $v"
          if [ "$v" = "BLOCK" ] || [ "$v" = "KILL" ]; then
            echo "::error::Falsify gate returned $v — see PR comment for findings."
            exit 1
          fi
