name: falsify

# Canonical CI gate for this repo. Require this check on main before merge/tag.
# Smoke test: L2-clean tagged doc exits 0; draft with open blocker markers exits nonzero.
# Lint is static only (not claim-bearing). No API key needed.
# (Drop-in PR gate for your own repo: templates/github-action-pr-review-prototype.yml)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falsify-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Install both [dev] and [quant] so tests/quant/ actually exercises the
        # statistical path (PBO/DSR/PSR + empyrical-reloaded metrics). Without
        # [quant], tests/quant/ would only pass via the defensive skip in
        # falsify/quant.py — which hides real metric regressions.
        run: python -m pip install -e '.[dev,quant]'

      - name: Authority wiring anti-rot (kernel bypass scanner)
        # Structural decay detector: claim-bearing sys.exit must use
        # exit_code_for_decision; no parse_verdict→EXIT; no SHIPPABLE lint.
        # Does not grant capital_authority — only blocks wiring rot.
        run: python tools/check_authority_wiring.py

      - name: Authority kernel + anti-rot tests
        run: python -m pytest tests/test_authority_kernel.py tests/test_authority_antirot.py tests/test_falsify_core.py -q

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: falsify --version
        run: python -m falsify --version

      - name: review dry-run must resolve without an API call
        run: python -m falsify review --dry-run -p deepseek examples/comparison-case-study/05-final-excerpt.md

      - name: run exposes independent drafter/reviewer flags
        run: python -m falsify run --help | grep -E -- '--drafter|--reviewer'

      - name: unknown provider must fail closed
        run: |
          if python -m falsify review --dry-run -p nosuchprovider examples/comparison-case-study/05-final-excerpt.md; then
            echo "::error::unknown provider unexpectedly passed"
            exit 1
          fi
          echo "OK — unknown provider correctly failed"

      - name: A clean tagged doc must exit 0 on L2 lint
        run: python -m falsify lint examples/comparison-case-study/05-final-excerpt.md

      - name: A draft with open issues must fail L2 lint (nonzero)
        run: |
          if python -m falsify lint examples/comparison-case-study/01-agent-a-draft-excerpt.md; then
            echo "::error::lint should have been L2_DIRTY, but exited 0"
            exit 1
          fi
          echo "OK — draft correctly L2_DIRTY (non-zero exit; not claim-bearing)"
