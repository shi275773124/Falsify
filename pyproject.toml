[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "falsify"
dynamic = ["version"]
description = "Adversarial review framework for AI-generated code, research, and production decisions."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "shi275773124" }]
keywords = ["ai", "agents", "review", "hallucination", "llm", "ci", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/shi275773124/Falsify"

[project.scripts]
falsify = "falsify:main"

[tool.setuptools]
py-modules = ["falsify"]

[tool.setuptools.dynamic]
version = { attr = "falsify.VERSION" }
